name: Build binaries

on:
  workflow_call:
    secrets:
      GHA_TOKEN:
        required: true
      VIVADO_ROOT_DIR:
        required: true
    inputs:
      vivado_version:
        description: 'Version of Vivado to use'
        default: "2024.2"
        type: string
        required: true

jobs:
  build:
    runs-on:
      group: Default
      labels: [self-hosted, vivado]
    name: Build Binaries
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Allow git dependencies
        if: github.event_name != 'push'
        run: |
          git config --global url."https://oxfordionics:${{ secrets.GHA_TOKEN }}@github.com".insteadOf ssh://git@github.com
          git config --global url."https://oxfordionics:${{ secrets.GHA_TOKEN }}@github.com/".insteadOf git@github.com:

      - name: Install
        run: poetry sync

      - name: Build Binaries
        run: |
          export PATH=${{ secrets.VIVADO_ROOT_DIR }}/${{ inputs.vivado_version || '2024.2' }}/bin/:$PATH
          poe build-binaries \
            --gh-user oxionics \
            --gh-password ${{ secrets.GHA_TOKEN }} \
            --publish
