name: Package

on:
  workflow_call:
    secrets:
      GHA_TOKEN:
        required: true
    inputs:
      INSTALL_ARGS:
        required: false
        type: string
      TEST_TASK:
        required: false
        type: string
        default: test

jobs:
  test:
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    runs-on:
      group: Default
      # vivado = the Docker-capable builders; excludes the Docker-less deploy
      # runners that share the Default group. Temporary until they're regrouped.
      labels: [self-hosted, vivado]
    container: ghcr.io/oxionics/poetry:1.33-py${{ matrix.python }}
    name: Unit Tests (Python ${{ matrix.python }})
    steps:
      - uses: OxIonics/poetry-preamble@master
        with:
          INSTALL_ARGS: ${{ inputs.INSTALL_ARGS }}
          GHA_TOKEN: ${{ secrets.GHA_TOKEN }}
          PYTHON_VERSION: ${{ matrix.python }}

      - name: Test
        run: poe ${{ inputs.TEST_TASK }}
