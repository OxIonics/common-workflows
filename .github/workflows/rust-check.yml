name: Rust checks

# We shouldn't need to run `git lfs checkout`, as the checkout action above it should handle it.
# However, when a file is converted from non-LFS to LFS, the checkout on CI is not always
# updated correctly. This forces the checkout to the correct state.

on:
  workflow_call:
    inputs:
      RUN_TESTS:
        required: false
        default: true
        type: boolean
      CLIPPY_TOOLCHAIN:
        required: false
        default: ""
        type: string
      CLIPPY_FLAGS:
        required: false
        default: "--tests --all-features -- -D warnings"
        type: string
      FMT_TOOLCHAIN:
        required: false
        default: ""
        type: string

jobs:
  clippy:
    name: Clippy
    container:
      image: ghcr.io/oxionics/poetry:1.33-py3.10
    runs-on:
      group: Default
      labels: self-hosted
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
      - name: LFS checkout
        run: git lfs checkout
      - uses: actions-rust-lang/setup-rust-toolchain@v1.10.1
        with:
          toolchain: ${{ inputs.CLIPPY_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy ${{ inputs.CLIPPY_FLAGS }}

  test:
    name: Test
    if: ${{ inputs.RUN_TESTS }}
    container:
      image: ghcr.io/oxionics/poetry:1.33-py3.10
    runs-on:
      group: Default
      labels: self-hosted
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
      - name: LFS checkout
        run: git lfs checkout
      - uses: actions-rust-lang/setup-rust-toolchain@v1.10.1
      - uses: Swatinem/rust-cache@v2
      - run: poe test-rs
        name: Test
