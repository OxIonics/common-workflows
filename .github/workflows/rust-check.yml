name: Rust checks

on:
  workflow_call:
    inputs:
      RUN_TESTS:
        required: false
        default: true
        type: boolean
      CLIPPY_TOOLCHAIN:
        required: false
        default: ""
        type: string
      CLIPPY_FLAGS:
        required: false
        default: "--tests --all-features -- -D warnings"
        type: string
      FMT_TOOLCHAIN:
        required: false
        default: ""
        type: string

jobs:
  clippy:
    name: Clippy
    container:
      image: ghcr.io/oxionics/poetry:1.30-py3.10
    runs-on:
      group: Default
      labels: self-hosted
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.10.1
        with:
          toolchain: ${{ inputs.CLIPPY_TOOLCHAIN }}
          components: clippy

      - name: Lint with Clippy
        run: >
          cargo clippy
          ${{ inputs.CLIPPY_FLAGS }}

  test:
    name: Test
    if: ${{ inputs.RUN_TESTS }}
    container:
      image: ghcr.io/oxionics/poetry:1.30-py3.10
    runs-on:
      group: Default
      labels: self-hosted
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.10.1

      - name: Run Tests
        run: poe test-rs
